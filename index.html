<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スパイク動画解析</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>Ki-Log</h1>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data" id="upload-form">
      <label class="field">
        選手人数：
        <input type="number" id="num_players" name="num_players" min="1" max="10" value="{{ default_num_players }}">
      </label>

      <div id="player-fields">
        {% for i in range(1, 11) %}
          <label class="field player-field" data-index="{{ i }}" {% if i > default_num_players %}style="display:none"{% endif %}>
            選手{{ i }}：
            <input type="text" name="player_{{ i }}" placeholder="選手{{ i }}">
          </label>
        {% endfor %}
      </div>

      <label class="field">
        動画ファイル：
        <input type="file" name="video" accept="video/*" required>
      </label>

      <button type="submit">解析開始</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
